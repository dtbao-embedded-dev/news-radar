name: Publish image

# The package this project ships is the image, not a source checkout. A tag
# pushed by scripts/release.py publishes it to GHCR; the homelab then runs
# `docker compose pull` (or lets watchtower do it) and never clones anything.
# That is what keeps a deployment's config/, output/ and backups/ out of reach
# of `git checkout`, which is how this project has already lost a file once.
#
# "on" is quoted so YAML keeps it a string - bare `on:` parses as the boolean
# true, which makes every tool that reads this file disagree about the key.
# Same reason as .github/workflows/release.yml.
"on":
  push:
    tags:
      - "v*"

# contents: read is the checkout; packages: write is the push. Without the
# second one the job dies at the very end, after a build nobody was watching.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # Spelled out rather than built from github.repository: this exact string
      # also sits in docker/docker-compose.yml, and tests/test_deploy.py pins
      # that the two agree. A compose file pointing at an image nothing
      # publishes fails at `docker compose pull`, on the machine furthest from
      # anyone who could fix it.
      IMAGE: ghcr.io/dtbao-embedded-dev/news-radar

    steps:
      - uses: actions/checkout@v7

      # Same gate release.yml applies, for the same reason: reject a malformed
      # tag before it becomes a published package that has to be deleted.
      - name: Validate tag and derive the version
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like v1.2.3, got '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The tag is what the image carries in VERSION, and VERSION is baked into
      # the image by the Dockerfile - so a mismatch here would have the running
      # container report a version that was never published.
      - name: Refuse a tag the VERSION file disagrees with
        run: |
          file_version="$(cat VERSION)"
          if [ "$file_version" != "$VERSION" ]; then
            echo "::error::tag says $VERSION but VERSION says $file_version"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # linux/amd64 only: the homelab is x86_64 (measured). A second
      # architecture is build minutes bought for nobody, and buildx would have
      # to emulate it. Add one here the day the target changes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
