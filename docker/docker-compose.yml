# news-radar homelab stack.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Secrets come from docker/.env, which Compose loads automatically because it
# sits next to this file. scripts/setup.py creates it from .env.example.
#
# One file, two layouts, switched by NEWS_RADAR_HOME - the directory holding
# config/, output/ and backups/, resolved relative to this file:
#
#   unset (-> `..`)  a dev checkout: the repository root, exactly as before
#   `.`              a deployment directory: compose file, .env, Caddyfile and
#                    the data side by side, with no git anywhere near them
#
# That is the whole of "user data an update cannot reach": production keeps no
# checkout, so there is no `git checkout` on that machine to delete anything.
#
# The report is served on the LAN and published nowhere. There is no tunnel and
# no reverse proxy in this file: reaching it from outside is a decision for
# whatever fronts it, made outside this project.
#
# The `watchtower` service is behind the `autoupdate` profile, so the two lines
# above start the crawl loop and the web server and nothing else:
#
#   docker compose -f docker/docker-compose.yml --profile autoupdate up -d

name: news-radar

services:
  # Fetch -> filter -> rank -> store -> render -> notify, on an internal loop.
  # Exposes no port: it talks out, nothing talks in.
  news-radar:
    # Production runs this image; it never builds. `build:` is kept beside it so
    # a dev checkout still compiles what it is editing - compose only builds
    # when the image is absent locally, and on production `pull` has already put
    # it there. The one footgun: `up -d` before `pull` on a deployment directory
    # tries to build and dies on the missing Dockerfile. Pull first.
    image: ghcr.io/dtbao-embedded-dev/news-radar:${NEWS_RADAR_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: news-radar
    restart: unless-stopped
    # The only container watchtower is allowed to replace. caddy is `2-alpine`
    # and cloudflared is pinned to an exact version - letting either upgrade
    # itself would be an unreviewed change to the two things standing between
    # the report and the public internet.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEWS_RADAR_CONFIG: /app/config/config.yaml
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # The crawl talks to a dozen hosts it does not control, so it does not
    # borrow the host's resolver. On this homelab `www.reddit.com` failed to
    # resolve through it - on the host as well as in the container - while
    # `reddit.com` resolved and 301'd to the name that would not. One of the
    # eight fixed feeds was dead every cycle because of it. Public resolvers
    # answer it correctly; override these if your network requires its own.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - "${NEWS_RADAR_HOME:-..}/config:/app/config:ro"
      - "${NEWS_RADAR_HOME:-..}/output:/app/output"
      # Store backups, and deliberately NOT under output/. Caddy serves that
      # directory to the public web; a dated copy of the whole archive sitting
      # in it would be one Caddyfile line away from being downloadable. This
      # mount is on the crawl service only - caddy never sees the path at all.
      - "${NEWS_RADAR_HOME:-..}/backups:/app/backups"

  # Serves the deployment's output/ as static files. The published host port is
  # how anyone reaches it; nothing in this stack carries it further than the
  # LAN.
  caddy:
    image: caddy:2-alpine
    container_name: news-radar-caddy
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      # ./Caddyfile ships beside this compose file and is the same file in both
      # layouts; output/ belongs to the deployment and follows NEWS_RADAR_HOME.
      # Leaving this one behind is how the crawl publishes to one directory and
      # the web server serves another - the site 404s while every log line in
      # the crawl says success.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - "${NEWS_RADAR_HOME:-..}/output:/srv:ro"
      - caddy_data:/data
    # This is now the only way in, so it is not "debugging only" any more.
    # 8088 rather than 8080 by choice: a port of our own does not have to be
    # renegotiated the next time something else on the host wants 8080.
    ports:
      - "${NEWS_RADAR_HTTP_PORT:-8088}:8080"

  # Auto-update. Polls GHCR for a newer `:latest`, pulls it, and recreates the
  # one container carrying the label above - the bind mounts come back exactly
  # as they were, so nothing under NEWS_RADAR_HOME is touched by an update.
  #
  # Behind a profile for the same reason the tunnel is: on a dev checkout this
  # would pull `:latest` straight over the image the developer just built.
  # Production opts in:
  #
  #   docker compose --profile tunnel --profile autoupdate up -d
  #
  # Watchtower follows the tag the container was created from, not `:latest` in
  # general - so pinning NEWS_RADAR_VERSION freezes a deployment even with this
  # profile on, because a version tag does not move. Republishing that same tag
  # is the one thing that would get past it.
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: news-radar-watchtower
    profiles: ["autoupdate"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Without this watchtower updates every container on the host, including
      # ones that have nothing to do with this stack.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Drop the image the update replaced; otherwise every release leaves a
      # dangling copy on a homelab disk nobody is watching.
      WATCHTOWER_CLEANUP: "true"
      # Seconds. Once a day: this project cuts releases by hand, and a tighter
      # poll only spends registry requests.
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
    volumes:
      # `:ro` here is not a sandbox and must not be read as one: a socket is a
      # socket, and the flag only stops the socket *file* being replaced - every
      # Docker API call still goes through, which is exactly how watchtower
      # recreates a container. Access to this socket is root on the host. The
      # real narrowing is WATCHTOWER_LABEL_ENABLE above, plus the profile that
      # keeps this container from running anywhere it is not wanted.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  caddy_data:
