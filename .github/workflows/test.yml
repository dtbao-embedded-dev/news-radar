name: Test

# Runs the checks on every push and pull request, so a broken script is caught
# before a tag turns it into a published release.
#
# "on" is quoted for the same reason as release.yml: bare `on:` parses as the
# boolean true.
"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The scripts under scripts/ are standard library only, but the package
      # under src/ is not - test_config.py imports it, which imports PyYAML.
      - name: Install runtime dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      # The loop picks up new tests/test_*.py without this workflow having to
      # be edited again.
      - name: Run checks
        run: |
          for t in tests/test_*.py; do
            echo "--- $t"
            python "$t"
          done
